name: CrowdStream to Discord

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crowdstream-discord
  cancel-in-progress: false

jobs:
  notify:
    name: Fetch and notify
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out the default branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Check Python
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .
          uv run --locked -m unittest discover -s tests -v

      - name: Run CrowdStream bot
        id: bot
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PYTHONUNBUFFERED: "1"
        run: uv run --locked main.py

      - name: Persist delivery state
        if: ${{ always() && steps.bot.outcome != 'skipped' }}
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -A -- processed_ids.json
          if [ -f .backfill_complete ]; then
            git add -- .backfill_complete
          fi

          if git diff --cached --quiet; then
            echo "Delivery state is unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update CrowdStream delivery state"
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"

      - name: Report bot failure
        if: ${{ steps.bot.outcome == 'failure' }}
        run: |
          echo "The bot failed after its successful delivery state was persisted."
          exit 1
