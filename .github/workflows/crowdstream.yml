name: CrowdStream to Discord

on:
  schedule:
    # Every three hours, anchored at 16:17 East Africa Time (UTC+3).
    - cron: "17 1,4,7,10,13,16,19,22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crowdstream-discord
  cancel-in-progress: false

jobs:
  notify:
    name: Fetch and notify
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out the default branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v9
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Check Python
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .
          uv run --locked -m unittest discover -s tests -v

      - name: Validate persisted state
        run: |
          if jq -e '.full_scan_complete == true' scan_state.json >/dev/null \
            && [ "$(jq 'length' processed_ids.json)" -eq 0 ]; then
            echo "::error::Full scan is marked complete, but processed_ids.json is empty."
            exit 1
          fi

      - name: Run CrowdStream bot
        id: bot
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_PROGRAMS_WEBHOOK_URL: ${{ secrets.DISCORD_PROGRAMS_WEBHOOK_URL }}
          PYTHONUNBUFFERED: "1"
        run: uv run --locked main.py

      - name: Persist delivery state
        if: ${{ always() && steps.bot.outcome != 'skipped' }}
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -A -- processed_ids.json programs.json scan_state.json

          if git diff --cached --quiet; then
            echo "Delivery state is unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update CrowdStream delivery state"
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"

      - name: Report bot failure
        if: ${{ steps.bot.outcome == 'failure' }}
        run: |
          echo "The bot failed after its successful delivery state was persisted."
          exit 1
