[project]
name = "bugcrowd-crowdstream-discord"
version = "0.1.0"
description = "Post new Bugcrowd CrowdStream acceptances and disclosures to Discord."
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.14.3",
  "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "ruff>=0.16.5",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["ASYNC", "B", "BLE", "C4", "E4", "E7", "E9", "F", "I"]
